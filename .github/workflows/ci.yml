name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

      - name: Compile Python files
        run: python -m compileall -q app.py scripts tests

      - name: Check Python lint and formatting
        run: |
          python -m ruff check app.py scripts tests
          python -m ruff format --check app.py scripts tests

      - name: Check README contract
        run: python scripts/check_readme.py
